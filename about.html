<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilmoittaudu - Lapuan Lepakot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Lapuan Lepakot</h1>

        <nav>
            <a href="index.html">Etusivu</a>
            <a href="listing.html">Ottelut</a>
            <a href="contact.html">Harjoitukset</a>
            <a href="about.html">Ilmoittaudu</a>
        </nav>
    </header>

    <main>
        <h2>Ilmoittaudu kokeiluharjoitukseen</h2>

        <p>Täytä alla oleva lomake, jos haluat
            osallistua ilmaiseen kokeiluharjoitukseen.</p>

        <form id="ilmoittautumisLomake" novalidate>

         <label for="nimi">Nimi:</label>
    <br>
    <input type="text" id="nimi" name="nimi"
        aria-describedby="nimiVirhe">
    <p id="nimiVirhe" class="error" aria-live="polite"></p>

    <label for="sahkoposti">Sähköposti:</label>
    <br>
    <input type="email" id="sahkoposti" name="sahkoposti"
        aria-describedby="sahkopostiVirhe">
    <p id="sahkopostiVirhe" class="error" aria-live="polite"></p>

    <label for="ika">Ikä:</label>
    <br>
    <input type="number" id="ika" name="ika"
        min="1" aria-describedby="ikaVirhe">
    <p id="ikaVirhe" class="error" aria-live="polite"></p>

    <label for="viesti">Lisätietoja:</label>
    <br>
    <textarea id="viesti" name="viesti"
        aria-describedby="viestiVirhe"></textarea>
    <p id="viestiVirhe" class="error" aria-live="polite"></p>

    <button type="submit">Lähetä ilmoittautuminen</button>

    </form>
       <div id="onnistumisViesti" class="hidden" role="status">
    <p>
    Ilmoittautumistietosi tallennettiin tähän selaimeen.
    Tietoja ei lähetetty palvelimelle.
</p>
    </div>
    </main>

    <footer>
        <p>Lapuan Lepakot ry</p>
    </footer>
    <script>
   const lomake = document.getElementById("ilmoittautumisLomake");
const viesti = document.getElementById("onnistumisViesti");

lomake.addEventListener("submit", function(event) {
    event.preventDefault();

    const kentat = [
        {
            input: document.getElementById("nimi"),
            virhe: document.getElementById("nimiVirhe"),
            teksti: "Kirjoita nimesi."
        },
        {
            input: document.getElementById("sahkoposti"),
            virhe: document.getElementById("sahkopostiVirhe"),
            teksti: "Kirjoita kelvollinen sähköpostiosoite."
        },
        {
            input: document.getElementById("ika"),
            virhe: document.getElementById("ikaVirhe"),
            teksti: "Anna kelvollinen ikä."
        }
    ];

    let ensimmainenVirhe = null;

    kentat.forEach(function(kentta) {
        kentta.virhe.textContent = "";
        kentta.input.removeAttribute("aria-invalid");

        let virheellinen = false;

        if (kentta.input.value.trim() === "") {
            virheellinen = true;
        } else if (!kentta.input.checkValidity()) {
            virheellinen = true;
        }

        if (virheellinen) {
            kentta.virhe.textContent = kentta.teksti;
            kentta.input.setAttribute("aria-invalid", "true");

            if (!ensimmainenVirhe) {
                ensimmainenVirhe = kentta.input;
            }
        }
    });

    if (ensimmainenVirhe) {
        ensimmainenVirhe.focus();
        return;
    }

    const tiedot = {
        nimi: document.getElementById("nimi").value,
        sahkoposti: document.getElementById("sahkoposti").value,
        ika: document.getElementById("ika").value,
        viesti: document.getElementById("viesti").value
    };

    localStorage.setItem("ilmoittautuminen", JSON.stringify(tiedot));

   lomake.classList.add("hidden");
   viesti.classList.remove("hidden");
});
</script>
</body>
</html>
