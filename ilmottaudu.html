<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ilmoittaudu - Lapuan Lepakot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Lapuan Lepakot</h1>

        <nav>
            <a href="index.html">Etusivu</a>
            <a href="ottelut.html">Ottelut</a>
            <a href="harjoitukset.html">Harjoitukset</a>
            <a href="ilmoittaudu.html">Ilmoittaudu</a>
        </nav>
    </header>

    <main>
        <h2>Ilmoittaudu kokeiluharjoitukseen</h2>

        <p>Täytä alla oleva lomake, jos haluat
            osallistua ilmaiseen kokeiluharjoitukseen.</p>

        <form>

            <label for="nimi">Nimi:</label>
            <br>
            <input type="text" id="nimi" name="nimi" required>

            <br><br>

            <label for="sahkoposti">Sähköposti:</label>
            <br>
            <input type="email" id="sahkoposti"
                name="sahkoposti" required>

            <br><br>

            <label for="ika">Ikä:</label>
            <br>
            <input type="number" id="ika" name="ika"
                min="1" required>

            <br><br>

            <label for="viesti">Lisätietoja:</label>
            <br>
            <textarea id="viesti" name="viesti"></textarea>

            <br><br>

            <button type="submit">>Lähetä ilmoittautuminen</button>

        </form>
    </main>

    <footer>
        <p>Lapuan Lepakot ry</p>
    </footer>

</body>
</html>
